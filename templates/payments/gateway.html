{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درگاه پرداخت شبیه‌ساز - EXTIM</title>
    <!-- Tailwind & DaisyUI -->
    <link href="{% static 'css/dist/styles.css' %}" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(circle at center, #e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Glowing backdrop -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none flex items-center justify-center z-0">
        <div class="w-96 h-96 bg-primary/20 blur-[100px] rounded-full"></div>
    </div>

    <div class="card bg-base-100 shadow-2xl border border-base-200 w-full max-w-md relative z-10 overflow-hidden">
        <!-- Top decorative bar -->
        <div class="h-2 w-full bg-gradient-to-r from-primary to-secondary"></div>
        
        <div class="card-body p-8 sm:p-10 text-center flex flex-col items-center">
            
            <div class="w-20 h-20 bg-primary text-primary-content rounded-full flex items-center justify-center mb-4 shadow-lg shadow-primary/30">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
            </div>
            
            <h2 class="card-title text-base-content/70 text-lg mb-1">پذیرنده: فروشگاه EXTIM</h2>
            
            <div class="text-4xl font-black text-base-content my-6 flex items-center justify-center gap-2">
                <span class="text-2xl text-base-content/50 font-bold">تومان</span>
                {{ payment.amount }}
            </div>
            
            <div class="w-full bg-base-200/50 rounded-2xl p-4 text-sm font-medium text-base-content/70 border border-base-200 mb-8">
                <div class="flex justify-between items-center mb-3">
                    <span>شماره سفارش</span>
                    <span class="font-bold text-base-content">#{{ order.id }}</span>
                </div>
                <div class="flex justify-between items-center">
                    <span>وضعیت</span>
                    <span class="badge badge-warning badge-sm font-bold gap-1">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        در انتظار پرداخت
                    </span>
                </div>
            </div>

            <form method="post" action="{% url 'payments:process' order.id %}" class="w-full m-0 flex flex-col gap-3">
                {% csrf_token %}
                <button type="submit" name="action" value="success" class="btn btn-success btn-block rounded-xl font-bold text-lg h-14 shadow-lg shadow-success/20 hover:-translate-y-1 transition-all">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="mr-1"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    پرداخت موفق (شبیه‌سازی)
                </button>
                <button type="submit" name="action" value="fail" class="btn btn-ghost bg-base-200/50 hover:bg-error/10 text-error btn-block rounded-xl font-bold h-12 transition-all">
                    انصراف از پرداخت
                </button>
            </form>
            
            <div class="mt-8 flex items-center justify-center gap-2 text-xs font-bold text-base-content/40">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                محیط امن شبیه‌ساز پرداخت
            </div>
            
        </div>
    </div>

</body>
</html>
