{% extends "users/profile_base.html" %}

{% block profile_content %}
<div class="bg-base-100 border border-base-200 rounded-[2rem] p-6 md:p-10 shadow-sm">
    <div class="flex items-center gap-3 mb-8 pb-6 border-b border-base-200">
        <div class="w-12 h-12 bg-primary/10 text-primary rounded-2xl flex items-center justify-center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <h2 class="text-2xl md:text-3xl font-black m-0 tracking-tight">اطلاعات حساب کاربری</h2>
    </div>
    
    <form method="post" action="{% url 'users:profile' %}" enctype="multipart/form-data" class="flex flex-col gap-6">
        {% csrf_token %}
        
        <!-- Avatar Upload -->
        <div class="flex flex-col sm:flex-row items-center gap-6 p-6 bg-base-200/50 rounded-2xl border border-base-200 mb-2">
            <div class="w-24 h-24 bg-base-100 border-2 border-dashed border-primary rounded-full flex items-center justify-center overflow-hidden shrink-0 shadow-md">
                {% if user.avatar %}
                    <img id="avatar-preview-img" src="{{ user.avatar.url }}" alt="Avatar" class="w-full h-full object-cover">
                {% else %}
                    <span id="avatar-placeholder" class="text-3xl font-black text-primary">{{ user.email|make_list|first|upper }}</span>
                {% endif %}
            </div>
            <div class="flex flex-col items-center sm:items-start gap-2">
                <span class="font-bold text-base-content/80">تصویر پروفایل (آواتار)</span>
                <p class="text-xs text-base-content/50 m-0 text-center sm:text-right">حداکثر حجم فایل ۱ مگابایت (فرمت‌های JPG، PNG)</p>
                <div class="flex flex-col sm:flex-row items-center gap-3 mt-2">
                    <label for="avatar-upload" class="btn btn-outline btn-primary btn-sm rounded-xl">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mr-1"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        انتخاب تصویر
                    </label>
                    <span id="file-name-display" class="text-xs font-bold text-base-content/50 bg-base-200 px-3 py-1.5 rounded-lg border border-base-300 transition-colors duration-300">فایلی انتخاب نشده</span>
                    <input type="file" id="avatar-upload" name="avatar" accept="image/*" class="hidden" onchange="previewAvatar(this)">
                </div>
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-control">
                <label class="label pt-0"><span class="label-text font-bold">نام</span></label>
                <input type="text" name="first_name" value="{{ user.first_name }}" class="input input-bordered w-full bg-base-200/50 focus:bg-base-100 focus:border-primary transition-colors" minlength="2" pattern="^[^0-9]+$" title="نام نمی‌تواند شامل عدد باشد" required>
            </div>
            <div class="form-control">
                <label class="label pt-0"><span class="label-text font-bold">نام خانوادگی</span></label>
                <input type="text" name="last_name" value="{{ user.last_name }}" class="input input-bordered w-full bg-base-200/50 focus:bg-base-100 focus:border-primary transition-colors" minlength="2" pattern="^[^0-9]+$" title="نام خانوادگی نمی‌تواند شامل عدد باشد" required>
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-control">
                <label class="label pt-0"><span class="label-text font-bold">شماره موبایل</span></label>
                <input type="text" name="phone_number" value="{{ user.phone_number }}" placeholder="09xxxxxxxxx" class="input input-bordered w-full bg-base-200/50 focus:bg-base-100 focus:border-primary transition-colors text-left" dir="ltr" pattern="^09\d{9}$" title="شماره موبایل باید با 09 شروع شود و ۱۱ رقم باشد" required>
            </div>
            <div class="form-control">
                <label class="label pt-0">
                    <span class="label-text font-bold">آدرس ایمیل <span class="badge badge-sm badge-ghost opacity-60 ml-1">غیرقابل تغییر</span></span>
                </label>
                <input type="text" value="{{ user.email }}" disabled class="input input-bordered w-full bg-base-200/80 text-base-content/50 cursor-not-allowed border-dashed" dir="ltr">
            </div>
        </div>
        
        <div class="pt-4 border-t border-base-200 mt-2">
            <button type="submit" class="btn btn-primary h-12 px-8 rounded-xl font-bold shadow-lg shadow-primary/30 hover:-translate-y-1 transition-transform">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="mr-1"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                ذخیره تغییرات
            </button>
        </div>
    </form>
</div>

<script>
function previewAvatar(input) {
    const display = document.getElementById('file-name-display');
    const previewImg = document.getElementById('avatar-preview-img');
    const avatarPlaceholder = document.getElementById('avatar-placeholder');
    
    if (input.files && input.files[0]) {
        const file = input.files[0];
        // Show success indicator and filename
        display.innerHTML = `<span class="text-success font-bold flex items-center gap-1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> ${file.name} (آماده ذخیره)</span>`;
        display.classList.add('bg-success/10', 'border-success/30');
        display.classList.remove('bg-base-200', 'border-base-300', 'text-base-content/50');
        
        // Show image preview
        const reader = new FileReader();
        reader.onload = function(e) {
            if (previewImg) {
                previewImg.src = e.target.result;
            } else if (avatarPlaceholder) {
                avatarPlaceholder.outerHTML = `<img id="avatar-preview-img" src="${e.target.result}" alt="Avatar preview" class="w-full h-full object-cover">`;
            }
        }
        reader.readAsDataURL(file);
    } else {
        // Reset state
        display.textContent = 'فایلی انتخاب نشده';
        display.classList.remove('bg-success/10', 'border-success/30');
        display.classList.add('bg-base-200', 'border-base-300', 'text-base-content/50');
        
        // Note: Resetting the image back to original would require storing the original URL, 
        // which is a bit more complex. Usually users don't un-select files anyway.
    }
}
</script>
{% endblock %}
