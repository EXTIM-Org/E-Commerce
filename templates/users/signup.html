{% extends "base.html" %}

{% block title %}ثبت نام - فروشگاه EXTIM{% endblock %}

{% block content %}
<div class="auth-form-container">
  <h2 style="text-align: center; margin-top: 0; margin-bottom: 2rem; font-size: 2rem;">ساخت حساب کاربری</h2>
  
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn" style="width: 100%; margin-top: 1.5rem;">ثبت نام</button>
  </form>
  
  <p style="text-align: center; margin-top: 2rem; font-size: 0.95rem;">
    قبلاً ثبت نام کرده‌اید؟ <a href="{% url 'login' %}" style="color: var(--primary); text-decoration: none; font-weight: 600;">ورود</a>
  </p>
</div>
{% endblock %}
